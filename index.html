<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mahabub From BD</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      min-height: 100vh;
      transition: 0.3s;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 20px;
      background: rgba(0,0,0,0.2);
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      text-align: center;
      padding: 60px 20px;
    }

    .profile {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid white;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 35px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .about {
      text-align: center;
      padding: 60px 20px;
      background: rgba(255,255,255,0.1);
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .buttons a,
    button {
      border: none;
      padding: 12px 22px;
      border-radius: 25px;
      background: white;
      color: #333;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .buttons a:hover,
    button:hover {
      transform: scale(1.05);
    }

    .dark {
      background: #111;
      color: white;
    }

    .dark .about {
      background: #222;
    }
  </style>
</head>

<body>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#social">Social</a>
  </nav>

  <section id="home" class="container">

    <img
      src="FB_IMG_1766404124671.jpg"
      class="profile"
      alt="Mahabub"
    >

    <h1>Mahabub From BD</h1>

    <p>Welcome to my personal website ❤️</p>

    <button onclick="darkMode()">🌙 Dark Mode</button>

  </section>

  <section id="about" class="about">

    <h2>About Me</h2>

    <br>

    <p>
      Welcome to my website!
      এখানে আমার সম্পর্কে এবং আমার
      social media সম্পর্কে জানতে পারবে।
    </p>

  </section>

  <section id="social" class="about">

    <h2>My Social Media</h2>

    <br>

    <div class="buttons">

      <a
        href="https://www.facebook.com/share/17bcfMzNbs/"
        target="_blank">
        Facebook
      </a>

      <a
        href="https://www.youtube.com/@mdmahabubislam1309"
        target="_blank">
        YouTube
      </a>

      <a
        href="https://www.facebook.com/share/19fF75j2QY/"
        target="_blank">
        TikTok
      </a>

    </div>

  </section>

  <script>
    function darkMode() {
      document.body.classList.toggle("dark");
    }
  </script>

</body>
</html>
